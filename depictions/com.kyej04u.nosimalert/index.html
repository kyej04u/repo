<!DOCTYPE html>
<html><head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>NoSIMAlert</title>
    <style>
        @import url(https://cydia.saurik.com/cytyle/style-3163da6b7950852a03d31ea77735f4e1d2ba6699.css);
        @import url(http://cydia.saurik.com/cytyle/style-3163da6b7950852a03d31ea77735f4e1d2ba6699.css);
    </style>
    <meta name="viewport" content="initial-scale=1.0,width=device-width">
</head>
<body class="pinstripe">
    <panel>
        <fieldset>
            <div>
                <div>
                    <strong>NoSIMAlert</strong><br>
                    <span style="font-size: small">Version 1.0.0 &middot; iOS 3&ndash;6 &middot; Tweaks</span>
                </div>
            </div>
        </fieldset>
        <label>說明</label>
        <fieldset>
            <div>
                <div>
                    隱藏每次重啟都會跳出來的「尚未安裝 SIM 卡」提示，支援 iOS 3&ndash;6。
                </div>
            </div>
            <div>
                <div>
                    只擋「沒有 SIM 卡」這個提示，SIM PIN / PUK 輸入提示不會被擋掉，照常顯示。
                </div>
            </div>
        </fieldset>
        <label>Description</label>
        <fieldset>
            <div>
                <div>
                    Suppress the "No SIM Card Installed" alert (SBSIMLockAlertItem) on iOS 3-6. Only the no-SIM alert is blocked; SIM PIN/PUK and other SIM alerts are shown as normal.
                </div>
            </div>
        </fieldset>
    </panel>
</body></html>
